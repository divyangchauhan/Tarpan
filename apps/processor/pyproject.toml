[tool.poetry]
name = "tarpan-processor"
version = "0.0.1"
description = "Tarpan document processing Lambda — parses death certificates and generates legal documents"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
anthropic = ">=0.40.0,<1.0.0"
boto3 = "^1.35.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
pdfplumber = "^0.11.0"
Pillow = "^10.4.0"
weasyprint = "^62.3"
pydyf = "0.11.0"
Jinja2 = "^3.1.4"
httpx = "^0.27.0"
sentry-sdk = {version = ">=2.0.0,<3.0.0", extras = ["aws-lambda"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.8"
pytest-cov = "^5.0.0"
moto = { extras = ["s3", "sqs"], version = "^5.0.0" }
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.11.0"
boto3-stubs = { extras = ["s3", "sqs"], version = "^1.35.0" }
faker = "^30.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
  "src/config.py",  # Pydantic Settings — reads env vars, not unit-testable
]
